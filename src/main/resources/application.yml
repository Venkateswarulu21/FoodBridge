spring:
  application:
    name: foodbridge

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/food_bridge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: true
    properties:
      hibernate:
        default_batch_fetch_size: 50

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ssXXX"
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

app:
  seed-demo-data: ${SEED_DEMO_DATA:false}
  upload-dir: ${UPLOAD_DIR:uploads}

  mail:
    from: ${MAIL_FROM:foodbridge2124@gmail.com}
    brevo:
      api-key: ${BREVO_API_KEY:}

  login-otp:
    enabled: ${LOGIN_OTP_ENABLED:false}

  otp:
    ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-per-hour: 10

